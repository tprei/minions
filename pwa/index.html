<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0908">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="/assets/styles-v2.css?v=2026-05-08">
  <title>Minions</title>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script type="module" src="/assets/app-v1.js"></script>
  <script type="module">
    import { restoreTheme, createThemeToggle } from '/assets/components/theme-toggle.js';
    restoreTheme();

    let toggle = null;

    function ensureToggle() {
      const header = document.querySelector('header');
      if (!header) return;
      if (header.querySelector('.theme-toggle')) return;
      if (!toggle) toggle = createThemeToggle();
      header.appendChild(toggle);
    }

    const observer = new MutationObserver(() => ensureToggle());
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <script type="module" src="/assets/test-hooks.js"></script>
</body>
</html>
