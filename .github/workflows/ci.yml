name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Tests (with MWF_HAS_GIT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Configure git for integration tests
        run: |
          git config --global user.email "ci@minions.local"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: npm ci
      - name: Run test suite
        run: MWF_HAS_GIT=1 npm test

  pwa:
    name: PWA (typecheck + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: cd pwa && pnpm install --frozen-lockfile
      - name: Typecheck
        run: cd pwa && pnpm typecheck
      - name: Build
        run: cd pwa && pnpm build
      - name: Test
        run: cd pwa && pnpm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Build PWA
        run: cd pwa && pnpm install --frozen-lockfile && pnpm build
      - run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: MWF_HAS_GIT=1 npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
