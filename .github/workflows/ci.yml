name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Tests (with MWF_HAS_GIT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Configure git for integration tests
        run: |
          git config --global user.email "ci@minions.local"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: npm ci
      - name: Run test suite
        run: MWF_HAS_GIT=1 npm test
